name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.3", laravel: "13.*", testbench: "11.*" }
          - { php: "8.5", laravel: "13.*", testbench: "11.*" }
          - { php: "8.2", laravel: "12.*", testbench: "10.*" }
          - { php: "8.5", laravel: "12.*", testbench: "10.*" }
          - { php: "8.2", laravel: "11.*", testbench: "9.*" }
          - { php: "8.4", laravel: "11.*", testbench: "9.*" }
          - { php: "8.1", laravel: "10.*", testbench: "8.*" }
          - { php: "8.3", laravel: "10.*", testbench: "8.*" }
          - { php: "8.0", laravel: "9.*", testbench: "7.*" }
          - { php: "8.2", laravel: "9.*", testbench: "7.*" }
          - { php: "7.4", laravel: "8.*", testbench: "6.*" }
          - { php: "8.1", laravel: "8.*", testbench: "6.*" }

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: dependencies-laravel-${{ matrix.laravel }}-php-${{
            matrix.php }}-composer-${{ hashFiles('composer.json') }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/phpunit
